name: Build

# كل تعديل على main: الويب والـ APK ينبنون سوه من نفس التعديل وبنفس رقم النسخة،
# حتى الاثنين يبقون دائماً متطابقين. رقم النسخة يطلع أسفل الشاشة الرئيسية.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare platforms
        run: bash tools/prepare.sh

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build web
        run: flutter build web --release --dart-define=BUILD=${GITHUB_SHA::7}

      - name: Deploy to Cloudflare Pages
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # نشيل أي فراغ أو سطر جديد انلصق ويا المفتاح
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          echo "token length: ${#CLOUDFLARE_API_TOKEN}, account length: ${#CLOUDFLARE_ACCOUNT_ID}"
          npx --yes wrangler@4 pages project create lamma --production-branch=main 2>&1 | tail -3 || true
          npx --yes wrangler@4 pages deploy build/web --project-name=lamma --branch=main --commit-dirty=true

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # توقيع ثابت حتى كل نسخة تتحدث فوق القديمة
      - name: Signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Prepare platforms
        run: bash tools/prepare.sh

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --dart-define=BUILD=${GITHUB_SHA::7}
          cp build/app/outputs/flutter-apk/app-release.apk lamma.apk

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: لمّة - آخر نسخة
          body: "آخر نسخة APK من لمّة — نفس نسخة الويب (${{ github.sha }})"
          files: lamma.apk
          prerelease: false
          make_latest: true
