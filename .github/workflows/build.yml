name: Build

# كل تعديل على main: الويب والـ APK ينبنون سوه من نفس التعديل وبنفس رقم النسخة،
# حتى الاثنين يبقون دائماً متطابقين. رقم النسخة يطلع أسفل الشاشة الرئيسية.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # سيرفر الغرف (أونلاين): قواعد الألعاب من lib/logic تنبني لـ JavaScript
  # وتنرفع ويا السيرفر على Cloudflare (Workers + Durable Objects).
  # عنوانه ينحط بالويب والـ APK. إذا فشل، الألعاب تشتغل عادي والأونلاين يطلع "مو مفعّل".
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build game rules for server
        run: |
          flutter pub get
          dart compile js -O2 -o server/src/logic.js server/dart/main.dart

      - name: Deploy room server
        id: deploy
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          cd server
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.txt
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.txt | head -1)
          echo "server url: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # كلمة سر صفحة الإدارة (<السيرفر>/admin?key=...): من secret بـ GitHub اسمه ADMIN_KEY (إذا موجود)
      - name: Admin key
        if: steps.deploy.outputs.url != ''
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then echo "ADMIN_KEY مو موجود، صفحة الإدارة مطفية"; exit 0; fi
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          cd server
          printf '%s' "$ADMIN_KEY" | npx --yes wrangler@4 secret put ADMIN_KEY

  web:
    needs: server
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare platforms
        run: bash tools/prepare.sh

      - name: Analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      # WebAssembly (skwasm): رسم أسرع بهواية من النسخة العادية، وهذا يخلّي السحب واللعب سلس.
      # المتصفحات القديمة تاخذ النسخة العادية تلقائياً (Flutter يحط الاثنين).
      # الرؤوس بـ _headers تخلّي skwasm يشتغل بأكثر من خيط (أسرع).
      - name: Build web
        run: |
          flutter build web --release --wasm --dart-define=BUILD=${GITHUB_SHA::7} --dart-define=SERVER=${{ needs.server.outputs.url }}
          printf '/*\n  Cross-Origin-Opener-Policy: same-origin\n  Cross-Origin-Embedder-Policy: credentialless\n' > build/web/_headers
          cat build/web/_headers

      # روابط الدعوة /j/CODE: دالة Pages (functions/) تقرا الغرفة من السيرفر وتطلع بطاقة واتساب.
      # assetlinks.json: أندرويد يتأكد منه حتى الرابط يفتح التطبيق مباشرة (بصمة ci/debug.keystore).
      - name: Invite links
        run: |
          sed -i "s|__SERVER__|${{ needs.server.outputs.url }}|" "functions/j/[[code]].js"
          grep -n '^const SERVER' "functions/j/[[code]].js"
          SHA=$(keytool -list -v -keystore ci/debug.keystore -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d '[:space:]')
          test -n "$SHA"
          mkdir -p build/web/.well-known
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.lamma.games","sha256_cert_fingerprints":["%s"]}}]\n' "$SHA" > build/web/.well-known/assetlinks.json
          cat build/web/.well-known/assetlinks.json
          printf '/.well-known/assetlinks.json\n  Content-Type: application/json\n' >> build/web/_headers

      - name: Deploy to Cloudflare Pages
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # نشيل أي فراغ أو سطر جديد انلصق ويا المفتاح
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          echo "token length: ${#CLOUDFLARE_API_TOKEN}, account length: ${#CLOUDFLARE_ACCOUNT_ID}"
          npx --yes wrangler@4 pages project create lamma --production-branch=main 2>&1 | tail -3 || true
          npx --yes wrangler@4 pages deploy build/web --project-name=lamma --branch=main --commit-dirty=true

  apk:
    needs: server
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # توقيع ثابت حتى كل نسخة تتحدث فوق القديمة
      - name: Signing key
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: Prepare platforms
        run: bash tools/prepare.sh

      # نسخة ويب داخل الـ APK: تلفون صاحب الغرفة المحلية يقدّمها للآيفون والمتصفحات بدون إنترنت
      # (بدون CDN حتى كل ملفاتها تكون داخلها)
      - name: LAN web bundle
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --output build/lanweb --dart-define=BUILD=${GITHUB_SHA::7} --dart-define=SERVER=${{ needs.server.outputs.url }}
          # بدون ملفات التصحيح وبدون محرك skwasm/wimp (هاي النسخة تستخدم canvaskit بس)
          (cd build/lanweb && zip -qr -9 ../../assets/lan/web.zip . -x '*.map' '*.symbols' 'canvaskit/skwasm*' 'canvaskit/wimp*')
          ls -la assets/lan

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --dart-define=BUILD=${GITHUB_SHA::7} --dart-define=SERVER=${{ needs.server.outputs.url }}
          cp build/app/outputs/flutter-apk/app-release.apk lamma.apk

      # معلومات التحديث: التطبيق يقراها ويقارن رقم نسخته، ويعرض شنو الجديد (آخر 30 تعديل)
      - name: Update info
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//' | tr -d '\r')
          CHANGES=$(git log -30 --abbrev=7 --pretty=format:'%h%x09%cI%x09%s' | jq -R -s 'split("\n") | map(select(length>0) | split("\t") | {sha: .[0], date: .[1], title: .[2]})')
          jq -n --arg sha "${GITHUB_SHA::7}" --arg version "$VER" --arg sha256 "$(sha256sum lamma.apk | cut -d' ' -f1)" --argjson size "$(stat -c%s lamma.apk)" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson changes "$CHANGES" '{sha:$sha, version:$version, size:$size, sha256:$sha256, date:$date, changes:$changes}' > update.json
          cat update.json | head -c 600

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: لمّة - آخر نسخة
          body: "آخر نسخة APK من لمّة — نفس نسخة الويب (${{ github.sha }})"
          files: |
            lamma.apk
            update.json
          prerelease: false
          make_latest: true
