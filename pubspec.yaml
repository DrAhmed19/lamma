name: lamma
description: لمّة - ألعاب جماعية
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  app_links: ^7.2.2
  archive: ^4.7.1
  audioplayers: ^6.8.1
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  # اختبار الشاشات بأحجام مختلفة: flutter test tools/ui_test.dart
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/games/
    - assets/lan/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
