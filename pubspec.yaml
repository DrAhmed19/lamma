name: lamma
description: لمّة - ألعاب جماعية
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  web_socket_channel: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
    - family: Lalezar
      fonts:
        - asset: assets/fonts/Lalezar-Regular.ttf
