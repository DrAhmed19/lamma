# سيرفر غرف لمّة (أونلاين). كل غرفة = Durable Object واحد.
name = "lamma-rooms"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite = متوفر بالخطة المجانية
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# قائمة اللعب السريع (غرف عامة تنتظر لاعبين)
[[durable_objects.bindings]]
name = "MATCH"
class_name = "Match"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Match"]
